# GitHub Actions 작업 설명서: "언제, 어떤 컴퓨터에서, 무엇을 할지"
name: 시장 데이터 수집

on:
  schedule:
    # 1시간마다, 매시 17분 (시간은 UTC 기준). 정각은 전 세계 예약이 몰려 GitHub이 미루거나 건너뛰기 쉬워서 피한다.
    # 10분마다로 해 둬도 실제로는 1시간 간격 정도로만 돌았다 (2026-11-02~03 기록)
    # 실제 시작은 GitHub 사정으로 매시 50~59분쯤으로 늦어진다 (2026-11-04 기록)
    - cron: '17 * * * *'
  workflow_dispatch:          # Actions 화면에서 'Run workflow' 버튼으로 바로 실행 가능

permissions:
  contents: write             # 수집한 data.json을 저장소에 저장(커밋)할 권한

# 앞 실행이 아직 안 끝났으면 다음 실행은 기다렸다가 차례로 (동시에 저장하다 부딪히지 않게)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest    # GitHub이 빌려주는 리눅스 컴퓨터
    steps:
      - uses: actions/checkout@v5       # 1. 내 저장소 파일을 컴퓨터로 내려받기
        with:
          # 앞 실행을 기다렸다 도는 경우에도 '앞 실행이 저장한 최신 main'에서 시작하기
          # (지정하지 않으면 예약된 순간의 옛 파일에서 시작해서, 저장할 때 앞 실행 자료와 부딪힌다 — 2026-11-05 실패 원인)
          ref: main
      - uses: actions/setup-node@v5     # 2. Node.js 설치
        with:
          node-version: 24          # Node 20은 2026년 4월 지원 종료 (GitHub 경고가 떠서 올림)
      - run: node scripts/collect.mjs   # 3. 수집 스크립트 실행
      - name: 바뀐 데이터 저장(커밋)    # 4. data 폴더가 바뀌었으면 저장소에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "데이터 자동 수집"
          # 그사이 웹에서 다른 파일을 저장했으면, 그 위에 얹어서 다시 올리기 (최대 3번)
          # (2026-11-03: 올리는 순간에 웹 저장과 겹쳐 한 번 거절된 적이 있어서)
          # -X theirs = 같은 자료 파일이 부딪히면 방금 수집한 쪽(더 최신)을 남긴다
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true   # 실패했으면 다음 시도 전에 원래대로
            sleep 10
          done
          exit 1
