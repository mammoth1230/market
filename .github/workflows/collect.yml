# GitHub Actions 작업 설명서: "언제, 어떤 컴퓨터에서, 무엇을 할지"
name: 시장 데이터 수집

on:
  schedule:
    - cron: '*/10 * * * *'   # 10분마다 (시간은 UTC 기준, GitHub 사정에 따라 몇 분씩 밀리거나 건너뛸 수 있음)
  workflow_dispatch:          # Actions 화면에서 'Run workflow' 버튼으로 바로 실행 가능

permissions:
  contents: write             # 수집한 data.json을 저장소에 저장(커밋)할 권한

# 앞 실행이 아직 안 끝났으면 다음 실행은 기다렸다가 차례로 (동시에 저장하다 부딪히지 않게)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest    # GitHub이 빌려주는 리눅스 컴퓨터
    steps:
      - uses: actions/checkout@v4       # 1. 내 저장소 파일을 컴퓨터로 내려받기
      - uses: actions/setup-node@v4     # 2. Node.js 설치
        with:
          node-version: 20
      - run: node scripts/collect.mjs   # 3. 수집 스크립트 실행
      - name: 바뀐 데이터 저장(커밋)    # 4. data 폴더가 바뀌었으면 저장소에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "데이터 자동 수집"
          # 그사이 내가 웹에서 다른 파일을 저장했으면, 그 위에 얹어서 다시 올리기
          git pull --rebase origin main
          git push
