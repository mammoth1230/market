<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Market</title>
  <style>
    /* ── 화면 꾸미기(CSS) ── */
    body {
      margin: 0;
      padding: 24px 16px;
      background: #0f1115;
      color: #e8e8e8;
      font-family: -apple-system, "Malgun Gothic", sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { color: #f0b429; margin: 0 0 4px; }
    .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
    h2 { font-size: 16px; color: #aaa; margin: 28px 0 10px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .card {
      background: #181b22;
      border: 1px solid #262a33;
      border-radius: 12px;
      padding: 16px;
    }
    .name { color: #aaa; font-size: 14px; }
    .price { font-size: 24px; font-weight: bold; margin: 6px 0; }
    .up { color: #ff5a5a; }    /* 한국식: 상승 빨강 */
    .down { color: #4d8dff; }  /* 한국식: 하락 파랑 */
    .note { color: #666; font-size: 12px; margin-top: 8px; }
    button {
      margin-top: 24px; padding: 8px 14px; border-radius: 8px;
      border: 1px solid #333; background: #222; color: #ddd; cursor: pointer;
    }
    .tabs button { margin: 0 6px 8px 0; padding: 6px 12px; }
    .tabs button.on { background: #f0b429; color: #111; border-color: #f0b429; }
    .chart-box { position: relative; height: 260px; }
  </style>
  <!-- 그래프 그리기 도구(Chart.js)를 공용 CDN에서 불러오기 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>📊 My Market Calendar</h1>
    <div class="sub" id="time"></div>

    <h2>주요 지수 · 실시간 환율</h2>
    <div class="grid" id="quotes">불러오는 중…</div>
    <div class="note" id="quotes-note">출처: Yahoo Finance · GitHub Actions가 30분마다 수집</div>

    <h2>추이</h2>
    <div class="card">
      <div class="tabs" id="sym-tabs"></div>
      <div class="tabs">
        <button data-days="22">1개월</button>
        <button data-days="66">3개월</button>
        <button data-days="250" class="on">1년</button>
      </div>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </div>
    <div class="note" id="chart-note">출처: data/history.json (날짜별 종가 기록)</div>

    <h2>암호화폐</h2>
    <div class="grid" id="coins">불러오는 중…</div>
    <div class="note">출처: CoinGecko · 실시간 · 24시간 변동률</div>

    <h2>환율</h2>
    <div class="grid" id="fx">불러오는 중…</div>
    <div class="note">출처: Frankfurter(유럽중앙은행 기준) · 하루 1번 갱신 · 전일 대비</div>

    <button onclick="loadAll()">🔄 새로고침</button>
  </div>

  <script>
    // ── 숫자를 보기 좋게 바꾸는 작은 도구들 ──
    function won(n, digits = 0) {
      return n.toLocaleString('ko-KR', { maximumFractionDigits: digits }) + '원';
    }
    function change(pct) {
      const cls = pct >= 0 ? 'up' : 'down';
      const arrow = pct >= 0 ? '▲' : '▼';
      return `<span class="${cls}">${arrow} ${Math.abs(pct).toFixed(2)}%</span>`;
    }
    function card(name, price, pct) {
      return `<div class="card">
        <div class="name">${name}</div>
        <div class="price">${price}</div>
        ${change(pct)}
      </div>`;
    }

    // ── 1. 코인 시세: CoinGecko API에서 받아오기 ──
    async function loadCoins() {
      const box = document.getElementById('coins');
      try {
        const url = 'https://api.coingecko.com/api/v3/simple/price'
          + '?ids=bitcoin,ethereum&vs_currencies=krw&include_24hr_change=true';
        const data = await (await fetch(url)).json();
        box.innerHTML =
          card('비트코인 (BTC)', won(data.bitcoin.krw), data.bitcoin.krw_24h_change) +
          card('이더리움 (ETH)', won(data.ethereum.krw), data.ethereum.krw_24h_change);
      } catch (e) {
        box.textContent = '코인 시세를 불러오지 못했어요.';
      }
    }

    // ── 2. 환율: 최근 열흘치를 받아 마지막 두 날짜를 비교 ──
    async function loadFx() {
      const box = document.getElementById('fx');
      try {
        const start = new Date(Date.now() - 10 * 24 * 3600 * 1000).toISOString().slice(0, 10);
        const url = `https://api.frankfurter.dev/v1/${start}..?base=USD&symbols=KRW,JPY,EUR`;
        const data = await (await fetch(url)).json();
        const days = Object.keys(data.rates).sort();
        const today = data.rates[days[days.length - 1]];
        const prev = data.rates[days[days.length - 2]];

        // 1달러, 100엔, 1유로가 각각 몇 원인지 계산
        const rows = [
          ['미국 달러 (1 USD)', t => t.KRW],
          ['일본 엔 (100 JPY)', t => t.KRW / t.JPY * 100],
          ['유로 (1 EUR)', t => t.KRW / t.EUR],
        ];
        box.innerHTML = rows.map(([name, f]) =>
          card(name, won(f(today), 2), (f(today) / f(prev) - 1) * 100)
        ).join('');
        document.querySelector('#fx + .note').textContent =
          `출처: Frankfurter(유럽중앙은행 기준) · ${days[days.length - 1]} 기준 · 전일 대비`;
      } catch (e) {
        box.textContent = '환율을 불러오지 못했어요.';
      }
    }

    // ── 3. 지수: GitHub Actions가 모아 둔 내 저장소의 data/latest.json 읽기 ──
    async function loadQuotes() {
      const box = document.getElementById('quotes');
      try {
        // ?t=... 는 브라우저가 예전 파일을 재사용(캐시)하지 않게 하는 꼬리표
        const data = await (await fetch('data/latest.json?t=' + Date.now())).json();
        box.innerHTML = data.quotes.map(q =>
          card(q.name, q.price.toLocaleString('ko-KR', { maximumFractionDigits: 2 }), q.changePct)
        ).join('');
        document.getElementById('quotes-note').textContent =
          '출처: Yahoo Finance · GitHub Actions 수집 · 마지막 수집 '
          + new Date(data.updated).toLocaleString('ko-KR');
      } catch (e) {
        box.textContent = '지수 데이터를 불러오지 못했어요.';
      }
    }

    // ── 4. 추이 그래프: data/history.json의 날짜별 기록으로 선 그래프 그리기 ──
    const NAMES = { '^GSPC': 'S&P 500', '^IXIC': '나스닥', '^KS11': '코스피', '^KQ11': '코스닥', 'KRW=X': '원/달러' };
    let hist = {}, sym = '^KS11', days = 250, chart;

    function drawChart() {
      const rows = (hist[sym] || []).slice(-days);   // 최근 N거래일만
      const up = rows.length > 1 && rows[rows.length - 1][1] >= rows[0][1];
      const color = up ? '#ff5a5a' : '#4d8dff';         // 기간 중 올랐으면 빨강, 내렸으면 파랑
      if (chart) chart.destroy();                       // 예전 그래프 지우고 새로 그리기
      chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
          labels: rows.map(r => r[0]),
          datasets: [{ data: rows.map(r => r[1]), borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.2 }],
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          interaction: { mode: 'index', intersect: false }, // 마우스를 올리면 그 날짜 값 표시
          scales: {
            x: { ticks: { color: '#777', maxTicksLimit: 6 }, grid: { color: '#222' } },
            y: { ticks: { color: '#777' }, grid: { color: '#222' } },
          },
        },
      });
      document.getElementById('chart-note').textContent =
        `출처: data/history.json · ${NAMES[sym]} ${rows.length}거래일 (${rows[0]?.[0]} ~ ${rows[rows.length - 1]?.[0]})`;
    }

    async function loadHistory() {
      try {
        hist = await (await fetch('data/history.json?t=' + Date.now())).json();
        // 종목 버튼 만들기
        document.getElementById('sym-tabs').innerHTML = Object.keys(NAMES).map(s =>
          `<button data-sym="${s}" class="${s === sym ? 'on' : ''}">${NAMES[s]}</button>`
        ).join('');
        drawChart();
      } catch (e) {
        document.getElementById('chart-note').textContent = '추이 기록을 불러오지 못했어요.';
      }
    }

    // 버튼 누르면: 같은 줄의 버튼 색을 바꾸고 그래프 다시 그리기
    document.addEventListener('click', e => {
      const b = e.target.closest('.tabs button');
      if (!b) return;
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      if (b.dataset.sym) sym = b.dataset.sym;
      if (b.dataset.days) days = +b.dataset.days;
      drawChart();
    });

    function loadAll() {
      document.getElementById('time').textContent =
        '업데이트: ' + new Date().toLocaleString('ko-KR');
      loadQuotes();
      loadHistory();
      loadCoins();
      loadFx();
    }

    loadAll();
    setInterval(loadCoins, 60 * 1000); // 코인은 1분마다 자동 갱신
  </script>
</body>
</html>
